
input {
  udp {
    port => 5000
    codec => json
    type => "honeypot"
  }
}

filter {
  # 🌍 Add GeoIP data for the source IP
  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "geoip"
      database => "/usr/share/logstash/config/GeoLite2-City.mmdb"
    }
  }

  # 🏷️ Tag logs based on honeypot type
  if [type] == "cowrie" {
    mutate { add_tag => ["cowrie-log"] }
  } else if [type] == "dionaea" {
    mutate { add_tag => ["dionaea-log"] }
  } else {
    mutate { add_tag => ["honeypot-unknown"] }
  }

  # 🕒 Parse timestamps if present
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }
}

output {
  # 🚀 Send to Elasticsearch using service account token
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "changeme123"
    index => "honeypot-%{+YYYY.MM.dd}"
  }

  # 🧾 Print to console for debugging
  stdout { codec => rubydebug }
